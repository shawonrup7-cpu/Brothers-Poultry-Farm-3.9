<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075d3d"/>
      <stop offset="100%" stop-color="#0a8a5a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="chickenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f5ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Ground -->
  <rect x="0" y="370" width="512" height="142" rx="0" fill="#0a7a50"/>
  <ellipse cx="256" cy="372" rx="240" ry="30" fill="#0a8a5a"/>

  <!-- Sun rays -->
  <g transform="translate(256,160)" stroke="#ffe066" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="0" y1="-100" x2="0" y2="-130"/>
    <line x1="71" y1="-71" x2="92" y2="-92"/>
    <line x1="100" y1="0" x2="130" y2="0"/>
    <line x1="-71" y1="-71" x2="-92" y2="-92"/>
    <line x1="-100" y1="0" x2="-130" y2="0"/>
    <line x1="71" y1="71" x2="92" y2="92"/>
    <line x1="-71" y1="71" x2="-92" y2="92"/>
  </g>

  <!-- Sun -->
  <circle cx="256" cy="160" r="55" fill="url(#sunGrad)"/>

  <!-- Chicken body -->
  <ellipse cx="256" cy="310" rx="80" ry="70" fill="url(#chickenGrad)"/>

  <!-- Chicken head -->
  <circle cx="256" cy="215" r="48" fill="url(#chickenGrad)"/>

  <!-- Comb -->
  <ellipse cx="238" cy="173" rx="13" ry="20" fill="#e53935"/>
  <ellipse cx="256" cy="168" rx="14" ry="23" fill="#e53935"/>
  <ellipse cx="274" cy="173" rx="13" ry="20" fill="#e53935"/>

  <!-- Wattle -->
  <ellipse cx="256" cy="256" rx="14" ry="11" fill="#e53935"/>

  <!-- Beak -->
  <polygon points="256,232 282,242 256,254" fill="#ffb300"/>

  <!-- Eye -->
  <circle cx="270" cy="213" r="10" fill="#182230"/>
  <circle cx="273" cy="210" r="4" fill="white"/>

  <!-- Wings -->
  <ellipse cx="190" cy="305" rx="28" ry="50" fill="#d6ede0" transform="rotate(-20,190,305)"/>
  <ellipse cx="322" cy="305" rx="28" ry="50" fill="#d6ede0" transform="rotate(20,322,305)"/>

  <!-- Tail feathers -->
  <ellipse cx="165" cy="285" rx="18" ry="48" fill="#b2d8c0" transform="rotate(-40,165,285)"/>
  <ellipse cx="150" cy="300" rx="15" ry="40" fill="#9ecdb5" transform="rotate(-55,150,300)"/>

  <!-- Legs -->
  <line x1="230" y1="375" x2="215" y2="415" stroke="#ffb300" stroke-width="8" stroke-linecap="round"/>
  <line x1="282" y1="375" x2="297" y2="415" stroke="#ffb300" stroke-width="8" stroke-linecap="round"/>
  <line x1="215" y1="415" x2="190" y2="420" stroke="#ffb300" stroke-width="7" stroke-linecap="round"/>
  <line x1="215" y1="415" x2="213" y2="432" stroke="#ffb300" stroke-width="7" stroke-linecap="round"/>
  <line x1="297" y1="415" x2="322" y2="420" stroke="#ffb300" stroke-width="7" stroke-linecap="round"/>
  <line x1="297" y1="415" x2="299" y2="432" stroke="#ffb300" stroke-width="7" stroke-linecap="round"/>

  <!-- Grass tufts -->
  <ellipse cx="100" cy="380" rx="30" ry="12" fill="#0d9e60"/>
  <ellipse cx="400" cy="380" rx="30" ry="12" fill="#0d9e60"/>
  <ellipse cx="160" cy="375" rx="20" ry="9" fill="#0d9e60"/>
  <ellipse cx="350" cy="375" rx="20" ry="9" fill="#0d9e60"/>

  <!-- Border ring -->
  <rect width="512" height="512" rx="100" fill="none" stroke="#ffffff25" stroke-width="6"/>
</svg>
